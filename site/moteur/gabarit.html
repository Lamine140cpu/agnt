<style>
<!--SOCLE-->

/* ============================================================================
   MENUISERIE — la démonstration.

   Ce qui suit est TOUT ce qu'une page nouvelle doit écrire : sa palette, son
   en-tête, la hauteur de ses actes, ses voiles, son pied. Les soixante-dix-neuf
   règles de structure viennent du socle, inséré ci-dessus par la construction.
   C'est le premier site à le vérifier — les deux autres l'ont vu extraire de
   leur propre feuille, celui-ci n'a jamais eu de copie à lui.

   La palette : la même nuit que les deux autres sites, mais chaude. Le sujet
   est le bois, et le bleu-nuit d'une cabine de projection lui allait mal — les
   copeaux y viraient au gris. Le fond tire donc sur le brun, et l'accent est
   celui d'un chêne fraîchement raboté, pas d'un or.
   ============================================================================ */
:root{
  --noir:{{FOND}};        /* le fond, chaud */
  --nuit:{{SURFACE}};        /* la surface soulevée */
  --os:{{ENCRE}};          /* blanc chaud, jamais #fff */
  --gris:{{GRIS}};        /* gris chaud, accordé au fond */
  --sourd:{{SOURD}};       /* gris de second plan */
  --ambre:{{ACCENT}};       /* chêne fraîchement raboté */
  --ligne:rgba(237,231,222,.14);
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --marge:clamp(22px,6vw,110px);
  --max:1380px;
}

/* Les ancres se décalent de la hauteur de l'en-tête, sinon leur première ligne
   atterrit derrière lui. Mesuré ici : 54 px, arrondi à 84 pour la garde. */
[id]{scroll-margin-top:84px}
@media (max-width:899px){[id]{scroll-margin-top:104px}}

/* `padding` en RACCOURCI écraserait la marge latérale posée par `.bande` sur
   le même élément. Le défaut a été trouvé DEUX fois dans ce dépôt et ne se
   voit que sur téléphone : on n'écrit que le vertical. */
.bloc{padding-top:clamp(86px,13vh,170px);padding-bottom:clamp(86px,13vh,170px)}

/* L'en-tête. Il dit ce qu'est cette page avant qu'on ait lu une ligne. */
.tete{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;
  justify-content:space-between;align-items:center;gap:16px;
  padding:16px var(--marge);font-family:var(--mono);font-size:11px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--gris);
  background:linear-gradient(180deg,rgba({{FOND_RVB}},.95),rgba({{FOND_RVB}},.62) 70%,transparent)}
.tete b{color:var(--os);font-weight:500;letter-spacing:.34em}
.tete a{color:inherit;text-decoration:none}
.tete a:hover b{color:var(--ambre)}
.demo{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;
  border:1px solid var(--ambre);border-radius:2px;color:var(--ambre);
  letter-spacing:.18em;white-space:nowrap}
.demo i{width:5px;height:5px;border-radius:50%;background:var(--ambre);flex:0 0 auto}
@media (max-width:519px){.tete{font-size:10px}.demo{padding:5px 9px;letter-spacing:.1em}}

/* Chaque acte dure CINQ écrans. C'est la longueur qui donne au film le temps
   d'exister entre deux textes ; à trois, on lit plus qu'on ne regarde. */
#prologue section{min-height:500svh;position:relative;z-index:0}
/* Sur téléphone, deux écrans de moins par acte : douze écrans de prologue
   suffisent à épuiser la patience de n'importe qui. */
@media (max-width:820px){#prologue section{min-height:360svh}}

/* Les voiles. Strictement horizontaux ou verticaux : un dégradé incliné dans
   une boîte plus haute que large trace sa propre diagonale, et elle se voit. */
.a-g::before{background:linear-gradient(90deg,rgba({{FOND_RVB}},.95) 0%,
  rgba({{FOND_RVB}},.88) 26%,rgba({{FOND_RVB}},.5) 48%,rgba({{FOND_RVB}},.14) 68%,transparent 84%)}
.a-d::before{background:linear-gradient(270deg,rgba({{FOND_RVB}},.95) 0%,
  rgba({{FOND_RVB}},.88) 26%,rgba({{FOND_RVB}},.5) 48%,rgba({{FOND_RVB}},.14) 68%,transparent 84%)}
.a-c::before{background:linear-gradient(180deg,transparent 18%,rgba({{FOND_RVB}},.3) 42%,
  rgba({{FOND_RVB}},.78) 68%,rgba({{FOND_RVB}},.94) 100%)}

/* SUR TÉLÉPHONE, LE FILM PREND UNE BANDE, PAS TOUT L'ÉCRAN.
   La série étroite est ici le maître entier, moins large — pas un montage
   portrait. En cadrage « couvrir » sur un écran de téléphone, un cadre 16:9
   ne montrerait que 26 % de sa largeur : l'établi en sortirait. À 64 % de
   hauteur, la toile passe au rapport 0,72 et le film en montre 41 %. */
@media (max-width:820px){
  #toile{height:64svh;bottom:auto}
  .mot{max-width:none}
  .a-d .tenir,.a-c .tenir{align-items:stretch;text-align:left}
  .a-d .mot,.a-c .mot{margin:0}
  .a-d .defiler{justify-content:flex-start}
  .a-d .acte-num{flex-direction:row}
  .a-c .acte-num{justify-content:flex-start}
  .a-c .acte-num::after{display:block}
  /* Le voile se cale sur le bas de la toile : il doit être plein AVANT
     64 %, sinon le bord franc du film s'y voit comme un trait. */
  #prologue section::before{background:linear-gradient(transparent 8%,
    rgba({{FOND_RVB}},.4) 32%,rgba({{FOND_RVB}},.88) 52%,rgba({{FOND_RVB}},1) 62%)!important}
}

/* Le bas de page. Il ne vend pas une menuiserie : il explique ce qu'on vient
   de voir et qui l'a fait. C'est le seul discours honnête possible ici. */
#suite a{color:var(--ambre);text-decoration:none;
  border-bottom:1px solid rgba(192,138,74,.42);
  transition:border-color .25s ease,color .25s ease}
#suite a:hover{border-bottom-color:var(--ambre)}
.avis{border:1px solid var(--ambre);border-radius:2px;
  padding:clamp(22px,3vw,34px);margin-bottom:clamp(34px,5vh,56px)}
.avis p{margin:0;color:var(--os)}
.avis p + p{margin-top:12px;color:var(--gris)}
.grille{display:grid;gap:clamp(22px,3vw,38px);margin-top:clamp(30px,4vh,52px);
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grille .eti{margin-bottom:8px}
.pied{border-top:1px solid var(--ligne);
  padding-top:clamp(40px,6vh,64px);padding-bottom:clamp(30px,4vh,48px);
  display:flex;flex-wrap:wrap;gap:14px 40px;justify-content:space-between;
  align-items:baseline;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--sourd)}
</style>
</head>
<body>

<canvas id="toile"></canvas>

<header class="tete">
  <a href="#top"><b>{{MARQUE}}</b></a>
  {{ETIQUETTE_TETE}}
</header>

<main>
{{PROLOGUE}}

{{SUITE}}

<div class="voile" id="voile">
  <em id="etape">Composition du mouvement</em>
  <div class="jauge"><b id="jauge"></b></div>
  <p class="pct" id="pct">0 %</p>
</div>

<script>
/* Les séries de CETTE page. Le lecteur est partagé : la construction l'insère
   ci-dessous à partir de moteur/lecteur.js.

   Les deux séries sont le MÊME cadre, à deux définitions — la seconde n'est
   pas un recadrage portrait. C'est pourquoi la page donne au film une bande de
   64 svh sur téléphone : c'est le seul levier qui change le cadrage quand les
   deux pellicules montrent la même image.

   Comptes et dimensions sont ceux du mode replié ; la construction les mesure
   sur les images livrées et les remplace. */
window.SERIES = {
  accueil:          { chemin: 'assets/film/{{FILM}}/f',        images: 1152, largeur: 1920, hauteur: 1080 },
  'accueil-etroit': { chemin: 'assets/film/{{FILM}}-etroit/f',  images: 1152, largeur: 1440, hauteur: 810 },
};
</script>
<!--LECTEUR-->

</body>
</html>
